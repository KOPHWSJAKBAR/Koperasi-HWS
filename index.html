    <script>
      (function() {
        const origWarn = console.warn;
        const origError = console.error;
        console.warn = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('websocket'))) return;
          origWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('websocket') || args[0].includes('WebSocket') || args[0].includes('createWebSocketModuleRunnerTransport'))) return;
          origError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).includes('WebSocket')) {
            event.preventDefault();
          }
        });
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
